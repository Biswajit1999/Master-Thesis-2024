<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><style>text{font-family:Arial,sans-serif;fill:#14213d}.h{font-size:34px;font-weight:700}.b{font-size:21px;font-weight:700}.s{font-size:17px}.box{fill:#f7f9fc;stroke:#9dafbf;stroke-width:2}.arrow{stroke:#476582;stroke-width:4;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#476582"/></marker></defs><rect width="1200" height="520" fill="white"/><text x="55" y="55" class="h">V25 validation sequence</text><rect x="55" y="120" width="220" height="260" rx="16" class="box"/><text x="90" y="160" class="b">A. Fit check</text><text x="80" y="205" class="s">• one mount only</text><text x="80" y="236" class="s">• no powered fan</text><text x="80" y="267" class="s">• R45 contact</text><text x="80" y="298" class="s">• vent centring</text><text x="80" y="329" class="s">• gasket compression</text><rect x="330" y="120" width="220" height="260" rx="16" class="box"/><text x="365" y="160" class="b">B. Mount baseline</text><text x="355" y="205" class="s">• fan OFF</text><text x="355" y="236" class="s">• dX / dY</text><text x="355" y="267" class="s">• OPL</text><text x="355" y="298" class="s">• PT104 gradients</text><text x="355" y="329" class="s">• compare with no mount</text><rect x="605" y="120" width="220" height="260" rx="16" class="box"/><text x="640" y="160" class="b">C. Single fan</text><text x="630" y="205" class="s">• left intake only</text><text x="630" y="236" class="s">• right exhaust only</text><text x="630" y="267" class="s">• low airflow first</text><text x="630" y="298" class="s">• search for jitter</text><text x="630" y="329" class="s">• compare gradients</text><rect x="880" y="120" width="265" height="260" rx="16" class="box"/><text x="915" y="160" class="b">D. Push-pull</text><text x="905" y="205" class="s">• L IN + R OUT</text><text x="905" y="236" class="s">• matched conditions</text><text x="905" y="267" class="s">• thermal uniformity</text><text x="905" y="298" class="s">• pixel stability</text><text x="905" y="329" class="s">• OPL stability</text><line x1="275" y1="250" x2="325" y2="250" class="arrow"/><line x1="550" y1="250" x2="600" y2="250" class="arrow"/><line x1="825" y1="250" x2="875" y2="250" class="arrow"/><text x="55" y="450" class="b">Decision rule:</text><text x="200" y="450" class="s">keep only the configuration that reduces spatial thermal gradients without adding measurable short-timescale optical instability.</text></svg>