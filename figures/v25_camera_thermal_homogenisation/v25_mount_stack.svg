<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><style>text{font-family:Arial,sans-serif;fill:#14213d}.h{font-size:34px;font-weight:700}.b{font-size:22px;font-weight:700}.s{font-size:18px}.part{stroke:#34495e;stroke-width:2}.arrow{stroke:#34495e;stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#34495e"/></marker></defs><rect width="1200" height="720" fill="white"/><text x="55" y="55" class="h">V25 mount stack — one side</text><rect x="415" y="105" width="300" height="85" rx="8" fill="#343a40" class="part"/><text x="473" y="155" fill="white" style="font-family:Arial;font-size:21px;font-weight:700">30 x 30 x 10 mm fan</text><rect x="435" y="215" width="260" height="28" rx="5" fill="#b8d8ba" class="part"/><text x="735" y="237" class="s">1.5 mm compliant fan gasket</text><line x1="695" y1="229" x2="725" y2="229" class="arrow"/><rect x="395" y="270" width="340" height="85" rx="8" fill="#6c757d" class="part"/><circle cx="565" cy="312" r="46" fill="white" stroke="#34495e" stroke-width="2"/><text x="460" y="390" class="s">40 x 40 mm central rigid coverage</text><text x="760" y="300" class="s">Ø28 mm top throat</text><line x1="610" y1="305" x2="747" y2="300" class="arrow"/><path d="M390 405 Q565 510 740 405 L740 450 Q565 555 390 450 Z" fill="#8e9aa6" class="part"/><ellipse cx="565" cy="445" rx="72" ry="38" fill="white" stroke="#34495e" stroke-width="2"/><text x="780" y="440" class="s">Ø34 mm underside plenum</text><line x1="635" y1="445" x2="768" y2="440" class="arrow"/><path d="M390 490 Q565 595 740 490 L740 525 Q565 630 390 525 Z" fill="#d9ead3" class="part"/><text x="780" y="525" class="s">3.0 mm camera-side gasket</text><line x1="710" y1="510" x2="768" y2="520" class="arrow"/><path d="M300 600 Q565 690 830 600" fill="none" stroke="#c43d32" stroke-width="34"/><rect x="500" y="570" width="130" height="55" fill="#252a30"/><text x="500" y="655" class="s">camera vent</text><text x="860" y="615" class="s">R45 camera body</text><line x1="815" y1="605" x2="848" y2="610" class="arrow"/><text x="80" y="255" class="b">Rigid printed material never needs to sit directly on the anodised camera housing.</text><text x="80" y="292" class="s">The soft gasket occupies the nominal 3 mm clearance while the central opening remains free for airflow.</text><text x="80" y="330" class="s">The same geometry is mirrored as L IN and R OUT.</text></svg>