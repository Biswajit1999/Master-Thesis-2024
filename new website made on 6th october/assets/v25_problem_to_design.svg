<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><style>text{font-family:Arial,sans-serif;fill:#14213d}.h{font-size:34px;font-weight:700}.s{font-size:21px}.b{font-size:23px;font-weight:700}.small{font-size:17px}.box{fill:#f7f9fc;stroke:#aab7c7;stroke-width:2}.cam{fill:#c43d32;stroke:#7b231d;stroke-width:3}.vent{fill:#252a30;stroke:#111;stroke-width:2}.fan{fill:#31363d;stroke:#101317;stroke-width:3}.arr{stroke:#2878c8;stroke-width:8;fill:none;marker-end:url(#ab)}.arr2{stroke:#d75245;stroke-width:8;fill:none;marker-end:url(#ar)}</style><defs><marker id="ab" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2878c8"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d75245"/></marker></defs><rect width="1200" height="620" fill="white"/><text x="55" y="58" class="h">EXOhSPEC V25 — from thermal observation to testable hardware change</text><rect x="55" y="95" width="1090" height="450" rx="18" class="box"/><text x="90" y="140" class="b">Observed during the post-rotation monitoring run</text><text x="90" y="178" class="s">• detector TEC remained near -10 °C</text><text x="90" y="210" class="s">• liquid-cooling outlet remained near 22 °C</text><text x="90" y="242" class="s">• camera body regions remained at different temperatures</text><text x="90" y="274" class="s">• dY and OPL continued to drift</text><text x="90" y="318" class="small">Interpretation: a spatial body-temperature gradient is a plausible disturbance to test, not a proven cause.</text><rect x="485" y="170" width="350" height="210" rx="30" class="cam"/><rect x="510" y="220" width="62" height="110" class="vent"/><rect x="748" y="220" width="62" height="110" class="vent"/><text x="593" y="270" fill="white" style="font-family:Arial;font-size:24px;font-weight:700">ASI6200MM Pro</text><text x="604" y="305" fill="white" style="font-family:Arial;font-size:18px">liquid-cooled modification</text><rect x="450" y="220" width="55" height="110" rx="8" class="fan"/><rect x="815" y="220" width="55" height="110" rx="8" class="fan"/><path d="M390 275 H445" class="arr"/><path d="M875 275 H940" class="arr2"/><text x="350" y="245" class="b">L IN</text><text x="888" y="245" class="b">R OUT</text><text x="492" y="415" class="b">V25 hypothesis</text><text x="365" y="450" class="s">Use gentle push-pull airflow to reduce spatial gradients,</text><text x="405" y="482" class="s">then verify that pixel and OPL stability do not degrade.</text><text x="55" y="590" class="small">Design principle: minimise the disturbance introduced by the thermal-control experiment itself.</text></svg>