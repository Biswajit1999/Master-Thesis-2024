<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650"><style>text{font-family:Arial,sans-serif;fill:#14213d}.h{font-size:34px;font-weight:700}.b{font-size:22px;font-weight:700}.s{font-size:19px}.sm{font-size:16px}.line{stroke:#34495e;stroke-width:3;fill:none}.dim{stroke:#566573;stroke-width:2;fill:none;marker-start:url(#a);marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M8,4 L0,0 L0,8 z" fill="#566573"/></marker></defs><rect width="1200" height="650" fill="white"/><text x="55" y="55" class="h">Camera and vent geometry used for V25</text><text x="120" y="105" class="b">Side view</text><rect x="85" y="150" width="530" height="270" rx="120" fill="#c43d32" stroke="#7b231d" stroke-width="3"/><rect x="180" y="245" width="190" height="95" fill="#252a30"/><line x1="180" y1="230" x2="370" y2="230" class="dim"/><text x="238" y="215" class="s">~35 mm axial</text><text x="185" y="365" class="sm">visible side ventilation grille</text><line x1="85" y1="465" x2="615" y2="465" class="dim"/><text x="315" y="495" class="s">~97 mm body length</text><line x1="650" y1="150" x2="650" y2="420" class="dim"/><text x="670" y="290" class="s">Ø90 mm</text><text x="760" y="105" class="b">Cross-section / opposing vents</text><circle cx="895" cy="285" r="150" fill="#f4f6f7" stroke="#34495e" stroke-width="4"/><rect x="724" y="235" width="45" height="100" fill="#252a30"/><rect x="1021" y="235" width="45" height="100" fill="#252a30"/><path d="M895 135 A150 150 0 0 1 1034 230" class="line"/><text x="970" y="170" class="s">R45</text><text x="705" y="370" class="s">left vent</text><text x="1006" y="370" class="s">right vent</text><text x="765" y="410" class="sm">vents are opposite each other at the same axial location</text><text x="715" y="455" class="sm">manual curved span: ~45-50 mm around the camera circumference</text><rect x="70" y="540" width="1060" height="70" rx="12" fill="#eef4fb" stroke="#aac4df"/><text x="95" y="570" class="s">Design consequence: the mount covers the accessible upper majority of the curved grille rather than wrapping into the lower region</text><text x="95" y="597" class="s">near the existing camera support. Vent dimensions are manual laboratory measurements and remain subject to first-fit verification.</text></svg>