<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
  <title id="title">EXOhSPEC V25 sealed TPU fan-mount engineering layout</title>
  <desc id="desc">Technical schematic showing the left intake and right exhaust mounts around a 90 millimetre camera body, plus verified dimensions for the fan, airflow throat, plenum and curved sealing span.</desc>
  <defs>
    <linearGradient id="body" x1="0" x2="1"><stop stop-color="#7f2531"/><stop offset=".45" stop-color="#bd4652"/><stop offset="1" stop-color="#79232e"/></linearGradient>
    <linearGradient id="tpu" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1c2935"/><stop offset="1" stop-color="#05090d"/></linearGradient>
    <marker id="cyanArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#36a9cf"/></marker>
    <marker id="goldArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#d0922f"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#15324b}.title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#52687a}.label{font-size:18px;font-weight:700}.small{font-size:15px}.mono{font-family:Consolas,monospace;font-size:16px}.dim{stroke:#b56f13;stroke-width:2;fill:none;marker-start:url(#goldArrow);marker-end:url(#goldArrow)}.air{stroke:#36a9cf;stroke-width:9;fill:none;marker-end:url(#cyanArrow)}.guide{stroke:#98adba;stroke-width:1.5;stroke-dasharray:7 6}.call{fill:#fff;stroke:#c8d7e0;stroke-width:2}.hole{fill:#f7fafc;stroke:#6b7f8e;stroke-width:2}
    </style>
  </defs>
  <rect width="1400" height="840" rx="28" fill="#f7fafc"/>
  <text x="60" y="70" class="title">V25 v1.1 · sealed-side TPU airflow prototype</text>
  <text x="60" y="104" class="sub">Design intent — reduce the spatial camera-body gradient without adding a measurable optical vibration signature</text>

  <rect x="275" y="210" width="850" height="310" rx="155" fill="url(#body)"/>
  <ellipse cx="1125" cy="365" rx="90" ry="155" fill="#63202a" opacity=".7"/>
  <text x="566" y="350" fill="#fff" style="font-size:30px;font-weight:700">ASI6200MM Pro</text>
  <text x="565" y="389" fill="#fff" style="font-size:18px">modified liquid-cooled camera · Ø90 mm reference</text>
  <rect x="325" y="292" width="92" height="146" rx="12" fill="#0e1820"/>
  <rect x="983" y="292" width="92" height="146" rx="12" fill="#0e1820"/>
  <g opacity=".7" stroke="#93a8b5" stroke-width="3"><path d="M346 310v110M365 310v110M384 310v110M1004 310v110M1023 310v110M1042 310v110"/></g>

  <g>
    <path d="M210 260h150v210H210c-32-48-32-162 0-210Z" fill="url(#tpu)" stroke="#38536a" stroke-width="4"/>
    <rect x="120" y="282" width="118" height="166" rx="18" fill="#222d37" stroke="#07111a" stroke-width="4"/>
    <circle cx="179" cy="365" r="46" fill="#0a1015" stroke="#607485" stroke-width="4"/>
    <circle cx="142" cy="304" r="6" class="hole"/><circle cx="216" cy="304" r="6" class="hole"/><circle cx="142" cy="426" r="6" class="hole"/><circle cx="216" cy="426" r="6" class="hole"/>
    <path d="M172 365c-40-13-34-61 0-65 22 17 30 40 0 65Zm7 7c13 40 61 34 65 0-17-22-40-30-65 0Zm-7 7c-40 13-34 61 0 65 22-17 30-40 0-65Zm-7-7c-13-40-61-34-65 0 17 22 40 30 65 0Z" fill="#607485" opacity=".65"/>
    <text x="116" y="490" class="label">LEFT · intake</text>
  </g>
  <g>
    <path d="M1040 260h150c32 48 32 162 0 210h-150Z" fill="url(#tpu)" stroke="#38536a" stroke-width="4"/>
    <rect x="1162" y="282" width="118" height="166" rx="18" fill="#222d37" stroke="#07111a" stroke-width="4"/>
    <circle cx="1221" cy="365" r="46" fill="#0a1015" stroke="#607485" stroke-width="4"/>
    <circle cx="1184" cy="304" r="6" class="hole"/><circle cx="1258" cy="304" r="6" class="hole"/><circle cx="1184" cy="426" r="6" class="hole"/><circle cx="1258" cy="426" r="6" class="hole"/>
    <text x="1161" y="490" class="label">RIGHT · exhaust</text>
  </g>
  <path class="air" d="M55 365H118"/><path class="air" d="M236 365H326"/><path class="air" d="M1074 365h86"/><path class="air" d="M1280 365h68"/>
  <text x="59" y="342" class="small">enclosure air</text><text x="1240" y="342" class="small">outflow</text>

  <path class="dim" d="M275 573h850"/><path class="guide" d="M275 520v74M1125 520v74"/><text x="610" y="603" class="mono">camera reference Ø90 mm / R45</text>
  <path class="dim" d="M120 186h118"/><path class="guide" d="M120 282v-112M238 282v-112"/><text x="113" y="160" class="mono">30 × 30 × 10 mm fan</text>
  <path class="dim" d="M210 650h150"/><path class="guide" d="M210 470v200M360 470v200"/><text x="220" y="680" class="mono">40 mm axial width</text>

  <rect x="55" y="715" width="1290" height="82" rx="16" class="call"/>
  <g transform="translate(80 742)"><text class="mono">AIR THROAT</text><text y="27" class="label">Ø28 mm</text></g>
  <g transform="translate(305 742)"><text class="mono">INTERNAL CHAMBER</text><text y="27" class="label">36 × 49 mm</text></g>
  <g transform="translate(585 742)"><text class="mono">CURVED SEALING SPAN</text><text y="27" class="label">54 mm</text></g>
  <g transform="translate(875 742)"><text class="mono">CENTRE PLENUM</text><text y="27" class="label">~3.2 mm</text></g>
  <g transform="translate(1115 742)"><text class="mono">MATERIAL</text><text y="27" class="label">black TPU ~95A</text></g>
</svg>
